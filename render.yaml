# Existing service is independently managed: verify Dashboard settings separately.
services:
  - type: web
    runtime: static
    name: football-recruitment-intelligence
    repo: https://github.com/frenk4business/football-recruitment-intelligence
    branch: main
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/out
    autoDeployTrigger: checksPass
    previews:
      generation: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate, no-transform
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable, no-transform
      - path: /integrity/*
        name: Cache-Control
        value: public, max-age=31536000, immutable, no-transform
      - path: /data/*
        name: X-Robots-Tag
        value: noindex
      - path: /integrity/*
        name: X-Robots-Tag
        value: noindex
      - path: /release-manifest.json
        name: X-Robots-Tag
        value: noindex
