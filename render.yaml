# Static sites have no instance plan or region: delivery uses Render's global CDN.
services:
  - type: web
    runtime: static
    name: football-recruitment-intelligence
    repo: https://github.com/frenk4business/football-recruitment-intelligence
    branch: phase/02-player-dna
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/out
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Robots-Tag
        value: noindex
