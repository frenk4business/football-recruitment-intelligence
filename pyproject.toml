[project]
name = "football-recruitment-intelligence"
dynamic = ["version"]
description = "Reproducible open football data research"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb>=1.4,<2",
  "polars>=1.35,<2",
  "pyarrow>=22,<26",
  "pydantic>=2.12,<3",
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "typer>=0.20,<1",
  "httpx>=0.28,<1",
  "pyyaml>=6,<7",
  "numpy>=2.2,<2.4",
  "scikit-learn>=1.7,<2",
  "pymc>=5.25,<6",
  "arviz>=0.22,<1",
  "pillow==12.3.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2", "types-PyYAML>=6", "jsonschema>=4,<5"]

[project.scripts]
fri = "football_intelligence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)"

[tool.hatch.build.targets.wheel]
packages = ["src/football_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
