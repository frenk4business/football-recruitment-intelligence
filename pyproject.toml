[project]
name = "football-recruitment-intelligence"
version = "0.1.0"
description = "Reproducible open football data research"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb>=1.4,<2", "polars>=1.35,<2", "pyarrow>=22,<26",
  "pydantic>=2.12,<3", "fastapi>=0.120,<1", "uvicorn>=0.38,<1",
  "typer>=0.20,<1", "httpx>=0.28,<1", "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2", "types-PyYAML>=6", "jsonschema>=4,<5"]

[project.scripts]
fri = "football_intelligence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
